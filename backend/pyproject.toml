[project]
name = "prediccion-deportiva-backend"
version = "0.1.0"
description = "API de analisis y prediccion de resultados de futbol"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "email-validator>=2.2",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "argon2-cffi>=23.1",
    "cryptography>=43.0",
    "pyotp>=2.9",
    "slowapi>=0.1.9",
    "apscheduler>=3.10",
    "httpx>=0.27",
    "numpy>=1.26",
    "pandas>=2.2",
    "scipy>=1.13",
    "scikit-learn>=1.5",
    "joblib>=1.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.7",
    "black>=24.10",
    "pip-audit>=2.7",
]

[tool.setuptools]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"
# Las migraciones las genera Alembic; no tiene sentido pelearse con su formato.
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "C4"]
ignore = [
    "S101",  # assert: legitimo en tests
    "B008",  # Depends() en defaults ES el idioma de FastAPI, no un bug
    "UP017", # timezone.utc es mas explicito que el alias datetime.UTC
]

[tool.ruff.lint.per-file-ignores]
# Contrasenas y tokens de mentira en fixtures y datos de prueba.
"tests/*" = ["S105", "S106", "S311"]
# El generador de datos de demo usa `random`, no criptografia.
"manage.py" = ["S311"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
